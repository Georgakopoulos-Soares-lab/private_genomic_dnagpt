    verdict: >
      [V] FAIL. The two-block module crashes (SIGSEGV, exit 139) strictly
      between the CUDA device banner and its own first application-level
      log line, i.e. somewhere inside context creation, bootstrap setup, or
      key generation at `multiplicative_depth=64` — before encrypting any
      input, before any decrypt, and before writing an evidence JSON. `dmesg`
      and `journalctl` on the host show no OOM-killer or Xid entry at the
