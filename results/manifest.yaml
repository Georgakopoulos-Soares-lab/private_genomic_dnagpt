# DNAGPT local performance evaluation - run provenance
# Tags: [V] verified/measured, [U] unresolved/blocked, [A] assumption
model_repo: TencentAILabHealthcare/DNAGPT   # arXiv 2307.05628
host: MacBook (darwin arm64), Python 3.12, torch 2.13.0, device=mps/cpu
weights_dir: checkpoints/                    # 0.1b only (user decision); not committed

runs:
  - id: gsr_aataaa_human_full
    task: "Task 1 - Genomic Signal & Region Recognition"
    status: "[V] measured"
    weight: checkpoints/classification.pth   # fine-tuned dna_gpt0.1b_m
    dataset:
      source: "DeepGSR (Kalkatawi et al. 2019), Zenodo record 1117159, Data.zip"
      files: "data/gsr/Data/Human/PAS/hs_AATAAA_polyA.fa (pos), hs_negAATAAA_polyA.fa (neg)"
      format: "606 bp records; central AATAAA motif (idx 300:306) stripped -> 600 bp (DNAGPT format)"
      n: 22604   # 11302 real + 11302 fake, full balanced set
    device: mps
    metrics:
      accuracy: 0.9124
      precision: 0.8810
      recall: 0.9535
      f1: 0.9158
      confusion_[true][pred]: [[9846, 1456], [525, 10777]]
    reference: "DeepGSR human AATAAA test accuracy ~0.916"
    verdict: "[V] Reliable. Matches published accuracy within ~0.4 pts on the full test set."
    seconds: 140

  - id: mrna_xpresso_human_1ktest
    task: "Task 3 - Human mRNA Abundance Regression"
    status: "[V] PASS"
    weight: checkpoints/regression.pth        # fine-tuned dna_gpt0.1b_h (max_len 4096)
    dataset:
      source: "Xpresso human (Agarwal & Shendure 2020), recovered via Internet Archive"
      recovery: "krishna.gs.washington.edu offline -> Wayback Roadmap_...pM10Kb.txt.gz snapshot 20240420"
      build: "eval/build_mrna_testset.py (py3 port of setup_training_files.py); 18377 genes, last 1000 = test"
      window: "promoter[3000:13500] = 10.5kb (7kb up + 3.5kb down of TSS)"
      n: 1000
    device: mps
    metrics: {r2: 0.5616, pearson_r: 0.7532, spearman_r: 0.7454}
    reference: "DNAGPT paper r2 ~0.62 (Xpresso 0.59)"
    verdict: >
      [V] PASS. Pearson 0.753, r2 within ~0.05 of paper. Residual gap likely from non-identical
      test-split reproduction (pandas sample rs=1) + float32. See docs/data_provenance.md.

  - id: mrna_smoke_regression_sh
    task: "Task 3 - mRNA pipeline check"
    status: "[V] pipeline verified"
    dataset: {source: "scripts/regression.sh (2 author examples)", n: 2}
    metrics:
      example1: {gt: -1.1045, pred: -1.0637, abs_err: 0.041}
      example2: {gt: 0.1831,  pred: 0.1481,  abs_err: 0.035}

  - id: gue_prom_core_all / gue_prom_300_all / gue_splice_reconstructed
    task: "Task 2 - GUE (human promoters & splice sites)"
    status: "[V] PASS"
    dataset:
      source: "DNABERT-2 GUE (gdrive 1uOrwlf07qGQuruXqGXWMpPn8avBoW7T-, HF leannmlindsey/GUE)"
      datasets: "prom_core_all, prom_300_all, splice/reconstructed"
    method: "eval/finetune_gue.py: dna_gpt0.1b_m backbone + linear head, full fine-tune 3 epochs, MCC"
    device: mps
    metrics:
      prom_core_all: {mcc: 0.680, acc: 0.840, f1: 0.840, classes: 2}
      prom_300_all:  {mcc: 0.897, acc: 0.948, f1: 0.948, classes: 2}
      splice_reconstructed: {mcc: 0.831, acc: 0.895, f1: 0.892, classes: 3}
    reference: "DNABERT-2 GUE MCC ~0.69 / ~0.87 / ~0.85 [A] approximate"
    verdict: >
      [V] PASS. DNAGPT 0.1b (locally fine-tuned) competitive with DNABERT-2 on the human
      promoter/splice GUE subset. Covers 3 of 28 GUE datasets (the ones named in the brief).

