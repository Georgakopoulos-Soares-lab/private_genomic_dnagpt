      The reason: CryptoContext/key deserialization (cereal parsing +
      repopulating OpenFHE's static key maps) costs more (3.82s) than the
      thing it replaces (fresh KeyGen+EvalMultKeyGen+EvalRotateKeyGen,
      1.27s) at this context size. [A] Deserialization cost is expected to be
      roughly size-invariant per reader while a from-scratch EvalRotateKeyGen
      is the call known to have stalled 8.5+ minutes under *extreme* host
      contention (2026-07-25 session) -- so cross-process reload's real value
      proposition, if any, is likely CPU-contention avoidance for readers on
      a busy shared host, not raw wall-clock savings, and that has not been
      tested here (this run's host load had already dropped to ~150-175 by
      launch time). Do not claim a cross-process speedup from this evidence;
      this is a valid negative/boundary result, not tuned to force
      "practical" per CLAUDE.md. [U] Only two processes (one writer, one
      reader) were exercised; a many-reader scenario reusing one writer's
      output has not been measured.

