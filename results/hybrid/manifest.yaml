      [V] PASS, after fixing a genuine bug this run itself discovered. Two prior attempts
      at this exact gate (same fixture, same design, only T=8-specific instrumentation
      differing) crashed with `malloc(): unaligned tcache chunk detected` (glibc heap
      corruption) after roughly 28 minutes, with zero diagnostic output because
      std::cout was fully buffered when redirected to a log file and the crash never
      flushed it. Root cause, localized by adding flushed per-(row,col) progress
      logging inside the attention loop: the frozen T=2/T=3 files' final output-packing
      step (`finish()`/`output_block_plain()`/`measure()`) silently assumes
      T<=COPIES=4 -- one physical PACK_WIDTH-wide ciphertext slot per token -- true at
      T=2/T=3, false at T=8, where `output_block_plain(token)` wrote past the end of a
      SLOTS=4096-sized heap vector for token>=4. The instrumented retry confirmed the
      causal-attention circuit itself completed ALL 28 predicted round trips
      (T*(T-1)/2) correctly before the crash -- the bug was entirely in output
      packing, not the attention design closed in
      fhe_fides_real_d768_t3_{attention,full}_general_attention_scheme_b_a100_20260728.
      Fix: group tokens into ceil(T/COPIES)=2 output ciphertexts, addressed by a
      token's position WITHIN its group rather than its raw index; `main()` now
      decrypts each group and reassembles a flat T*D vector. After the fix, this run
      passed cleanly: global_rel_inf=3.69e-10 (same ~1e-10 band as every other Scheme B
      gate), round_trips=36 (28 attention + 8 LN1, exactly as designed),
      final_decrypt_calls=2 (= ceil(8/4), confirming the fix's own arithmetic). [V] This
      is a genuinely new, more restrictive scaling ceiling than the causal-score
      packing one already known (HEADS*SCORE_SLOT_STRIDE<=PACK_WIDTH-D, T<=21): the
      output-packing ceiling was T<=COPIES=4, now fixed generally (works for any T,
      not just <=8). [U] No speed claim: this run's 523.65s (T=8, 32 matmul() calls) is
      not compared against the T=3 anchor's 130.61s (T=3, 12 matmul() calls) --
      different T, uncontrolled host load (shared host was fully occupied by another
      tenant for ~5 hours before this GPU freed up). [U] The `full` gate (LN2+GELU+MLP)
      was not re-run at T=8 in this session; only `attention` is confirmed at T=8.
      Full account: docs/hybrid/tasks.md's 2026-07-29 "T=8 growth-trend check and
