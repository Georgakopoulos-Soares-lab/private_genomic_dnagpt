      372.27s total at ring_dim=65536/depth 16 -- roughly 6.6x faster wall
      time on top of needing half the ring dimension, because every
      nonlinearity resets to level 0 via the client boundary instead of
      consuming Chebyshev depth. encrypted_evaluation_seconds_gpu (372.27s)
      splits into server_linear_algebra_seconds (365.78s, 98.3%) and
      client_boundary_seconds_total (6.49s, 1.7%, 24 round trips averaging
      ~0.27s each). This is now the anchor measurement for the 12-block,
      T=2 linear extrapolation in docs/hybrid/tasks.md: naive x12 gives 4467.2s
      (74.45 min) of encrypted evaluation (4389.4s server + 77.9s client
      boundary across 288 round trips) plus a one-time ~6.9s context
      keygen/embed-encrypt setup, assuming key reuse and unchanged per-block
      cost across all 12 blocks -- an [A] assumption, not yet independently
      verified per-block, and explicitly does not cover T>2 (the T=2
      attention identity does not generalize; scaling to real downstream
      sequence lengths needs a general causal-attention Scheme B circuit
      that has not been designed or measured) or the task-head compute.

