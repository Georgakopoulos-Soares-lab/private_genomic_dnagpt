    verdict: >
      [V] PASS -- the first complete, task-length encrypted DNAGPT forward
      pass in this project: all 12 released transformer blocks plus the
      encrypted GSR N-minus-A head, at the real T=103 GSR prompt length,
      client-assisted CKKS, on real GPU hardware. Per-block accuracy is
      tight and consistent (global_rel_inf 2.3e-9 to 2.1e-8 across all 12
      blocks, no degradation trend across the 11 inter-block full-state
      refreshes), and the final decrypted head margin
      (12.2665818... vs the direct-oracle 12.2665819...) matches the
      frozen Phase-A plaintext prediction bit-for-bit at the reported
      precision (label "N", label_matches=true) -- both many orders of
      magnitude inside the 4e-2 gate. Zero intermediate decrypts; the
      evaluator never holds the private key.
      Wall clock 6683s (~1.86h) on a genuinely clean, telemetry-confirmed
      single-GPU node (gpu-a100 partition, not the shared gpu-a100-dev;
      host_load1 averaged 9.9, peaked at 29.1 across 653 samples) --
      the cleanest full-scale measurement in this project's history.
      Per-block cost is tight (533.9-558.9s, ~4.5% spread across all 12
      blocks) and matches the T123_V3 single-block campaign figure
      (592-663s, jobs 3345272/3347729), confirming the encode-once
      diagonal-cache lever composes correctly and without per-block
      degradation across a full 12-block, 11-refresh, real client-boundary
      run -- not just the 4-block partial sample from the same-day A0
      calibration (job 3355234) or the 2-block short composition from
      2026-07-25/26.
      This supersedes two prior open items: (1) docs/hybrid/roadmap.md's
      "[U] complete task-length encrypted inference... remain unmeasured"
      and (2) the same day's own A0 calibration finding that the
      NON-T123 cpudiagcache-only driver projects to ~5.1h/12 blocks --
      the T123_V3-composed driver is both faster (~1.86h vs ~5.1h
      projected) and, unlike the A0 probe, actually ran to completion.
      Host RSS peaked at 49.7 GiB target-process (VmHWM), essentially
      unchanged from the single-block T123_V3 campaign figures
      (44.5-49.0 GiB) -- confirms the earlier finding that each block's
      EncryptedEvaluator is destroyed and freshly constructed per
      iteration, so memory does not accumulate across the 12 blocks.
      Server/client split: 85.5% server-GPU / 14.5% client-CPU-boundary
      of encrypted_evaluation time -- consistent with the single-block
      campaign's ~85-88%/12-15% split.
      Remaining open items this result does NOT close: clean-vs-repeated
      variance (this is one sample, not yet repeated on a second clean
      node); a real networked client/server transport (all 10299
      boundary crossings here are in-process function calls, not WAN
      RPCs); and encrypted token-index embedding lookup (still out of
      scope, unchanged).
