      and client_boundary_seconds_total (1.37s, 2x decrypt+invsqrt+re-encrypt
      of a SLOTS=4096 vector) -- this split is the key input for extrapolating
      how much of Scheme B's cost is server-GPU vs client-CPU-boundary work.
      [U] attention and full gates were attempted the same session but the
      run was killed after 8.5+ minutes of CPU-bound rotation-key generation
      stalling under extreme host contention (load average ~1000-1127 on a
      255-core shared machine, GPU itself idle at 1% util); deferred until
      host load drops. Context-keygen time here is therefore not reported as
      a clean number and setup_seconds is omitted from metrics above.

