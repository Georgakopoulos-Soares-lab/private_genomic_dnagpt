# The optimization campaign
#
# Ordered history of what was tried, what was kept, and what was abandoned, for one complete
# DNAGPT transformer block at 103 tokens.
#
# The load-bearing property of this campaign: the crypto-operation schedule is identical at
# every step. Same 156 dense products, same 177,734 ciphertext-plaintext multiplications, same
# 1,506 ciphertext-ciphertext multiplications, same 8,173 rotations, same 857 client crossings,
# same depth, same packing, same frozen plaintext reference. Every change alters only how host
# CPU work and host memory are organized. The speedup is therefore attributable to systems
# engineering, not to a cheaper or weaker circuit.
#
# Use descriptive names. Internal tags (T123, v0/v1/v2/v3, config1/2/3) do not appear in prose.

meta:
  updated: 2026-08-14
  invariants_held: >
    Operation schedule, packing layout, multiplicative depth, client-boundary sequencing, and
    the frozen plaintext reference are unchanged across every retained step. Each run asserts
    the full operation counts and fails closed on any deviation.
  hardware: "One NVIDIA A100 (40 GB) on a whole-node allocation, using 32 CPU threads. The node's
    total core count is not recorded in any committed artifact; 32 is the thread request."

# ---------------------------------------------------------------------------
# Retained: the chain that produced the reported result
# ---------------------------------------------------------------------------

retained:

  - id: opt.baseline
    name: "Baseline: re-encode every plaintext at every multiplication"
    order: 0
    what: >
      Each of the 156 dense products rebuilds and re-encodes all 1,024 packed diagonal
      plaintexts of its weight matrix, giving 159,744 encoding operations per block.
    why_it_was_slow: >
      Approximately 90 percent of those encodings are byte-for-byte identical: each of the 12
      weight matrices is reused across all 13 token groups. Two historical repeats showed the
      process at 3,900 to 4,700 percent CPU, motivating the host-encoding optimization. Those
      artifacts do not constitute a current causal CPU/CUDA profile or prove that GPU work was
      not limiting wall time.
    block_time_s: 7560
    block_time_tag: "[U]"
    block_time_note: >
      Approximately 2.1 hours per block. Attested by the measuring engineer from the
      pre-optimization runs. See open_provenance below.

  - id: opt.thread_affinity
    name: "Thread affinity and NUMA-local allocation"
    order: 1
    what: >
      Bind OpenMP threads close to cores, pin thread placement to physical cores, and allocate
      host memory local to the running CPUs, so encoding threads do not migrate and
      host-to-device staging reads from near memory.
    delta_server_pct: -16.3
    delta_client_pct: -36.4
    delta_wall_pct: -20.1
    tag: "[V]"
    measurement: >
      Paired comparison against the immediately preceding configuration, same node type, same
      circuit, same reference. Operation schedule unchanged.
    note: >
      The client boundary benefits most because it is pure host CPU work with no GPU
      involvement, so it is the part most exposed to thread migration.

  - id: opt.encode_once_clone_per_use
    name: "Encode once, clone per use"
    order: 2
    what: >
      Encode each distinct packed diagonal exactly once into a pristine, device-unloaded
      plaintext template. Every multiplication then receives a lightweight clone that shares
      the encoded host data by reference but carries fresh device state.
    effect: "Removes approximately 90 percent of the 159,744 per-block encodings."
    tag: "[V]"
    why_clone_and_not_reuse: >
      Reusing the plaintext object itself was tried first and crashed on every attempt. The
      backend returns early from its plaintext-load path when an object is already marked
      loaded, so a template loaded at one multiplicative level was silently reused at a
      different level with stale residue-number-system limbs. The clone resolves this
      structurally rather than by patching: fresh device state forces a correct load at the
      level actually required, and the object lifetime per operation is identical to the
      baseline's. See abandoned.gpu_plaintext_object_reuse.
    validation: >
      Validated in isolation by a dedicated GPU micro-test before being applied to the full
      block: clone-versus-fresh-encode equality, one template reused across different
      multiplicative levels, thousands of clone multiplications with stable GPU memory, and
      parallel-versus-serial encoding equality.

  - id: opt.parallel_batched_encode
    name: "Parallel batched encoding"
    order: 3
    what: >
      Encode the 1,024 templates of a weight matrix concurrently across the 32 available cores
      with dynamic scheduling, instead of serially.
    tag: "[V]"
    note: >
      Encoding is embarrassingly parallel and was the dominant serial cost once redundant
      encodings were removed. Parallel and serial encodings were verified to produce identical
      output before use.

  - id: opt.bounded_host_memory
    name: "Encode at the level of use, and flush between stages"
    order: 4
    what: >
      Key each template cache by weight matrix and required multiplicative level, and encode at
      that level directly, so templates carry fewer limbs and are roughly half the size. Flush
      the cache after the projection stage and after the attention projection, since no weight
      matrix recurs across those stage boundaries.
    effect_mib: [25530, 12434, 48610]
    effect_tag: "[V]"
    effect_note: >
      Measured host resident set size across the three stages: projection with three weight
      matrices resident, attention with none resident, MLP with eight resident. The peak is
      bounded by the largest single stage rather than by all twelve matrices at once.
    enabling_not_merely_faster: >
      Without this, the encode cache is fatal rather than beneficial. The unbounded version was
      killed by the operating system at 61,863 MiB resident, with an allocation failure at the
      instant the MLP stage began building templates on top of everything still cached from
      earlier stages. Time and space trade against each other here, and the trade has to be
      made explicitly.
    exactness: >
      Encoding at the level of use is exact, not an approximation. A level-zero plaintext would
      be dropped to the same level by the library before the multiplication anyway.

# ---------------------------------------------------------------------------
# Validated, but NOT part of the measured 652 s run.
#
# Verified by reading the source: the host key-map release exists only in the later driver
# variant. The driver that produced the reported result does not call it. Keep it out of the
# campaign chain in the manuscript, or re-identify which run is being reported.
# ---------------------------------------------------------------------------

validated_not_in_measured_run:

  - id: opt.release_host_key_copies
    name: "Release host-side key copies after context load"
    in_measured_run: false
    what: >
      After the relinearization key and 80 rotation keys are uploaded to the GPU, immediately
      release the library's host-side copies, which remain resident but unused for the rest of
      the run.
    tag: "[V]"
    validation: >
      A GPU micro-test confirmed that ciphertext-ciphertext multiplication,
      ciphertext-plaintext multiplication, rotation, and a fresh encrypt-decrypt round trip all
      remain correct after the release, with deviations at the 1e-9 to 1e-10 level.

