open_provenance:
  - id: prov.client_side_run
    concerns: "client.peak_ram, client.share_latest"
    status: "Awaiting the push"
    detail: >
      Further client-side optimization and the 14 GB peak-client-memory figure are attested by
      the implementing engineer but the supporting run is not yet in the repository. Use
      client.share_documented (18.2 percent) in the manuscript until it lands.

  - id: prov.baseline_wall_time
    concerns: opt.baseline.block_time_s
    status: "Confirm before submission"
    detail: >
      The approximately 2.1 hour pre-optimization block time is attested by the measuring
      engineer and is the denominator of the headline factor of 11.6. The committed walkthrough
      documents the baseline's CPU saturation but does not record its wall time as a number.
      Obtain the recorded value, or restate the headline against a baseline that is documented
      with a number.
