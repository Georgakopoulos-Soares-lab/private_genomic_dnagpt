# ---------------------------------------------------------------------------
# Abandoned, with mechanism. These constrain future work and explain the retained design.
# ---------------------------------------------------------------------------

abandoned:

  - id: neg.gpu_plaintext_object_reuse
    name: "Reusing GPU-resident plaintext objects"
    outcome: "Crashed on 6 of 6 attempts across 6 devices, at an identical code path."
    tag: "[V]"
    mechanism: >
      The backend's plaintext-load path returns early when an object is already flagged as
      loaded, so a template loaded at one multiplicative level was reused at another with stale
      device limbs, faulting inside device memory growth during the multiplication.
    controls: "Byte-identical same-day control runs passed."
    resolution: >
      Abandoned rather than patched. The clone-per-use design in opt.encode_once_clone_per_use
      captures the same benefit without depending on backend lifetime semantics.

  - id: neg.parallel_client_boundaries
    name: "Parallelizing client boundary crossings"
    outcome: "Intermittent race; two distinct crash signatures across runs of unchanged code."
    tag: "[V]"
    mechanism: >
      Concurrent decryption and encryption against a shared crypto context is not safe in the
      evaluated backend.
    resolution: >
      Abandoned as a documented negative result. Client boundaries remain sequential. This
      leaves the largest identified remaining headroom on the client side, since the boundary
      work is independent per tile and would parallelize cleanly given a thread-safe context.

  - id: neg.native_batched_linear_transform
    name: "Library-native batched linear transform"
    outcome: "Correct, but 1.6 to 1.9 times slower than the hand-written call sites."
    tag: "[V]"
    measurement: "Same run, sibling call sites, so host conditions were identical."
    resolution: >
      Not propagated. A correct but slower primitive is a negative result, not an optimization.

  - id: neg.two_process_mlp_split
    name: "Splitting the MLP across two GPU processes"
    outcome: "Exact merge arithmetic, but not buildable."
    tag: "[V]"
    mechanism: >
      The evaluated backend serializes the crypto context and keys but not ciphertexts, so a
      process-per-GPU decomposition cannot return its partial results for recombination.
    resolution: >
      Blocked at the library boundary. The same wall blocks any process-sharded evaluation of
      the full model. Adding ciphertext transport is systems research, not a parameter change.

# ---------------------------------------------------------------------------
# Identified but not yet done. Name these in future work, not in results.
# ---------------------------------------------------------------------------

open:

  - id: open.mask_plaintext_encoding
    name: "Cache the mask plaintexts"
    tag: "[U]"
    what: >
      The head, score-isolation, lane, copy-activity, and repetition mask plaintexts are still
      encoded fresh at every use: approximately 17,400 host encodings per block, concentrated
      in exactly the stage where GPU utilization is lowest.
    why_it_matters: >
      This is the same class of redundancy that opt.encode_once_clone_per_use removed for
      weight diagonals, in the stage that the resource trace identifies as the idle one. It is
      the clearest remaining target.

  - id: open.distinct_transforms_per_copy
    name: "Apply distinct transforms across the four packed copies"
    tag: "[A]"
    what: >
      The layout carries four activation copies but applies the same public matrix to all four.
      Encoding different diagonals per copy would let one encrypted transform produce query,
      key, and value in three copies, and the four MLP expansion chunks in four copies.
    projected_effect: >
      Before mask and copy-repair overhead, dense products would fall from 156 to approximately
      52, and dense ciphertext-plaintext multiplications from 159,744 to approximately 53,248,
      reducing the block's total ciphertext-plaintext count by roughly 60 percent.
    status: "Analysed, not implemented. Requires exact reconstruction proof before building."

  - id: open.full_layernorm_at_client
    name: "Move complete LayerNorm to the existing client boundary"
    tag: "[A]"
    what: >
      The client already participates in LayerNorm to evaluate the exact inverse square root.
      Having it evaluate the complete normalization including affine terms would remove
      encrypted operations and may lower the required multiplicative depth.
    status: "Analysed, not implemented. Changes the client/server work split, so it is a protocol choice."

