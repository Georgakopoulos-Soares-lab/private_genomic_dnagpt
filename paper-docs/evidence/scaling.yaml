# Sequence-length structure across the encrypted-scope tasks
#
# One task -- genomic signal recognition -- has a measured complete encrypted inference. The
# others carry circuit size only: token counts, ciphertext groups, and causal score tiles. They
# deliberately carry no time estimate, because the per-block timings such estimates were built
# from come from a shared partition and cannot enter the manuscript.
#
# Token counts are arithmetic, not choices: DNAGPT tokenizes overlapping 6-mers, so a window of
# B base pairs becomes B/6 tokens, plus the task-format special tokens. Eight tokens are packed
# per ciphertext, so a prompt of T tokens needs ceil(T/8) ciphertext groups.

meta:
  updated: 2026-08-08
  packing: "Eight tokens per ciphertext group."
  anchor: gsr
  anchor_note: >
    Genomic signal recognition at 103 tokens is the measured anchor: it is the longest
    encrypted-scope prompt, so it is the hardest case in the family and the honest one to
    anchor on.
  circuit_size_basis: >
    Causal score tiles are the lower-triangular group pairs, g(g+1)/2 for g ciphertext groups,
    so circuit size grows quadratically in group count while token count grows linearly. This is
    arithmetic on the packing layout, not a timing model.

tasks:

  - id: gue_prom_core
    name: "Core promoter detection"
    family: "Genome understanding evaluation"
    basepairs: 70
    kmer_tokens: 12
    special_tokens: 1
    tokens: 13
    token_groups: 2
    causal_score_tiles: 3
    causal_score_tiles_tag: "[A]"
    plaintext_metric: "MCC 0.680"

  - id: gue_prom_300
    name: "300 bp promoter detection"
    family: "Genome understanding evaluation"
    basepairs: 300
    kmer_tokens: 50
    special_tokens: 1
    tokens: 51
    token_groups: 7
    causal_score_tiles: 28
    causal_score_tiles_tag: "[A]"
    plaintext_metric: "MCC 0.897"

  - id: gue_splice
    name: "Splice-site classification"
    family: "Genome understanding evaluation"
    basepairs: 400
    kmer_tokens: 67
    special_tokens: 1
    tokens: 68
    token_groups: 9
    causal_score_tiles: 45
    causal_score_tiles_tag: "[A]"
    plaintext_metric: "MCC 0.831"

  - id: gsr
    name: "Genomic signal recognition"
    family: "Polyadenylation-signal motif"
    basepairs: 600
    kmer_tokens: 100
    special_tokens: 3
    tokens: 103
    token_groups: 13
    causal_score_tiles: 91
    causal_score_tiles_tag: "[A]"
    full_pass_seconds: 6683
    full_pass_human: "1.86 h"
    full_pass_tag: "[V]"
    full_pass_note: >
      Measured. All twelve blocks and the released task head executed at this prompt length on
      an uncontended node, 2026-08-12. One sample.
    peak_host_mib: 50930
    peak_host_tag: "[V]"
    plaintext_metric: "accuracy 0.9124, F1 0.916"

out_of_encrypted_scope:

  - id: mrna
    name: "mRNA abundance regression"
    basepairs: 10500
    kmer_tokens: 1750
    special_tokens: 5
    tokens: 1755
    token_groups: 220
    tag: "[U]"
    why_excluded: >
      At 1,755 tokens the prompt needs 220 ciphertext groups. The causal schedule visits the
      lower-triangular group pairs, so it needs 220 * 221 / 2 = 24,310 score tiles, growing
      quadratically in the number of groups. That is a different scale of problem from the
      classification tasks, not a longer version of the same one. The task remains in the paper
      as plaintext model-fidelity evidence only.
    causal_score_tiles: 24310
    causal_score_tiles_tag: "[A]"

# ---------------------------------------------------------------------------
# Rules for using this file
# ---------------------------------------------------------------------------

rules:
  - "The 103-token complete-model time and its peak host memory are measured, once. Everything else here is circuit size, not time."
  - "Do not restore per-task time estimates. The per-block timings they were built from come from a shared partition and cannot enter the manuscript."
  - "Any figure built from this file must visually separate the measured anchor from anything derived."
  - "State the token derivation whenever a token count appears: base pairs divided by six, plus specials."
  - "The mRNA row exists to explain an exclusion. Do not use it to imply a longer-sequence capability."
