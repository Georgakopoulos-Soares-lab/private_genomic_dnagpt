# Sequence-length scaling across the encrypted-scope tasks
#
# One task is measured. The others are projections from the measured anchor, using the same
# circuit and the same packing. Projections are tagged [A] and must be drawn and captioned so a
# reader can tell them apart from the measurement at a glance.
#
# Token counts are arithmetic, not choices: DNAGPT tokenizes non-overlapping chunks with stride
# six, including a final short chunk, so a window of B base pairs becomes ceil(B/6) tokens plus
# the task-format special tokens. Eight tokens are packed per ciphertext, so a prompt of T tokens
# needs ceil(T/8) ciphertext groups.

meta:
  updated: 2026-09-07
  packing: "Eight tokens per ciphertext group."
  anchor: gsr
  anchor_note: >
    Genomic signal recognition at 103 tokens is the measured anchor: it is the longest
    encrypted-scope prompt, so it is the hardest case in the family and the honest one to
    anchor on.
  projection_basis: >
    The whole-program illustrative projection is full.wall * token_groups / 13, using the
    telemetry-confirmed clean complete-run wall time of 6683 seconds. Per-block projections use
    full.per_block_mean * token_groups / 13. This assumed group-linear model holds the released
    circuit, packing, depth, head, and hardware fixed. It does not fit the quadratic attention
    cost, distinguish fixed overhead, or model different task heads. It is not measured latency
    for the alternative task classifiers.
  projection_source: "measurements.yaml full.wall and full.per_block_mean; task token_groups in this file"

tasks:

  - id: gue_prom_core
    name: "Core promoter detection"
    family: "Genome understanding evaluation"
    basepairs: 70
    kmer_tokens: 12
    special_tokens: 1
    tokens: 13
    token_groups: 2
    block_seconds: 84.17939660316667
    block_tag: "[A]"
    full_pass_seconds: 1028.1538461538462
    full_pass_human: "~17 min"
    full_pass_tag: "[A]"
    peak_host_gib: [40, 45]
    peak_host_tag: "[A]"
    plaintext_metric: "MCC 0.680"

  - id: gue_prom_300
    name: "300 bp promoter detection"
    family: "Genome understanding evaluation"
    basepairs: 300
    kmer_tokens: 50
    special_tokens: 1
    tokens: 51
    token_groups: 7
    block_seconds: 294.62788811108334
    block_tag: "[A]"
    full_pass_seconds: 3598.5384615384614
    full_pass_human: "~1.0 h"
    full_pass_tag: "[A]"
    peak_host_gib: [45, 45]
    peak_host_tag: "[A]"
    plaintext_metric: "MCC 0.897"

  - id: gue_splice
    name: "Splice-site classification"
    family: "Genome understanding evaluation"
    basepairs: 400
    kmer_tokens: 67
    special_tokens: 1
    tokens: 68
    token_groups: 9
    block_seconds: 378.80728471425
    block_tag: "[A]"
    full_pass_seconds: 4626.692307692308
    full_pass_human: "~1.3 h"
    full_pass_tag: "[A]"
    peak_host_gib: [46, 46]
    peak_host_tag: "[A]"
    plaintext_metric: "MCC 0.831"

  - id: gsr
    name: "Genomic signal recognition"
    family: "Polyadenylation-signal motif"
    basepairs: 600
    kmer_tokens: 100
    special_tokens: 3
    tokens: 103
    token_groups: 13
    block_seconds: 547.1660779205834
    block_note: "Measured mean across the twelve blocks in the complete run, not a standalone-block run."
    block_tag: "[V]"
    full_pass_seconds: 6683
    full_pass_human: "~1.86 h"
    full_pass_tag: "[V]"
    full_pass_note: >
      Measured complete run of all twelve blocks, eleven inter-block refreshes, and the released
      genomic-signal task head. One clean sample; independent repetition remains open.
    peak_host_gib: [49.7, 49.7]
    peak_host_tag: "[V]"
    plaintext_metric: "accuracy 0.9124, F1 0.916"

out_of_encrypted_scope:

  - id: mrna
    name: "mRNA abundance regression"
    basepairs: 10500
    kmer_tokens: 1750
    special_tokens: 5
    tokens: 1755
    token_groups: 220
    tag: "[U]"
    why_excluded: >
      At 1,755 tokens the prompt needs 220 ciphertext groups, and the causal attention tile
      count grows quadratically in the number of groups, to 24,310 score tiles. That is
      a different scale of problem from the classification tasks, not a longer version of the
      same one. The task remains in the paper as plaintext model-fidelity evidence only.

# ---------------------------------------------------------------------------
# Rules for using this file
# ---------------------------------------------------------------------------

rules:
  - "The 103-token per-block mean and complete genomic-signal pass are measured. Shorter-task rows use assumed group-linear scaling."
  - "Never present a projected full-pass time as an end-to-end latency result."
  - "Any figure built from this file must visually separate the measured anchor from the projections."
  - "State the token derivation whenever a token count appears: ceiling of base pairs divided by six, plus specials."
  - "The mRNA row exists to explain an exclusion. Do not use it to imply a longer-sequence capability."
