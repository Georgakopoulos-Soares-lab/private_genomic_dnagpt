out_of_encrypted_scope:

  - id: mrna
    name: "mRNA abundance regression"
    basepairs: 10500
    basepairs_tag: "[V]"
    kmer_tokens: 1750
    kmer_tokens_tag: "[A]"
    special_tokens: 5
    special_tokens_tag: "[V]"
    tokens: 1755
    tokens_tag: "[A]"
    token_groups: 220
    token_groups_tag: "[A]"
    encrypted_evaluation_tag: "[U]"
    source: >
      released mRNA task formatting and DNAGPT tokenizer; derived as ceil(10500/6)+5 tokens,
      ceil(1755/8) groups, and g(g+1)/2 score tiles
    why_excluded: >
      At 1,755 tokens the prompt needs 220 ciphertext groups. The causal schedule visits the
      lower-triangular group pairs, so it needs 220 * 221 / 2 = 24,310 score tiles, growing
      quadratically in the number of groups. That is a different scale of problem from the
      classification tasks, not a longer version of the same one. The task remains in the paper
      as plaintext model-fidelity evidence only.
    causal_score_tiles: 24310
    causal_score_tiles_tag: "[A]"

# ---------------------------------------------------------------------------
# Rules for using this file
# ---------------------------------------------------------------------------

rules:
  - "The 103-token complete-model time and its peak host memory are measured, once. Everything else here is circuit size, not time."
  - "Do not restore per-task time estimates. The per-block timings they were built from come from a shared partition and cannot enter the manuscript."
  - "Any figure built from this file must visually separate the measured anchor from anything derived."
  - "State the token derivation whenever a token count appears: ceil(base pairs divided by six), plus specials."
  - "The mRNA row exists to explain an exclusion. Do not use it to imply a longer-sequence capability."
