# Sequence-length structure across the encrypted-scope tasks
#
# One task -- genomic signal recognition -- has a measured complete encrypted inference. The
# others carry circuit size only: token counts, ciphertext groups, and causal score tiles. They
# deliberately carry no time estimate, because the per-block timings such estimates were built
# from come from a shared partition and cannot enter the manuscript.
#
# Token counts are arithmetic, not choices: DNAGPT chunks the sequence into non-overlapping
# 6-mers, retaining a shorter final token when needed, so a window of B base pairs becomes
# ceil(B/6) sequence tokens plus task-format special tokens. Eight tokens are packed per
# ciphertext, so a prompt of T tokens needs ceil(T/8) ciphertext groups.

meta:
  updated: 2026-08-14
  packing: "Eight tokens per ciphertext group."
  anchor: gsr
  anchor_note: >
    Genomic signal recognition at 103 tokens is the measured anchor: it is the longest
    encrypted-scope prompt, so it is the hardest case in the family and the honest one to
    anchor on.
  circuit_size_basis: >
    Causal score tiles are the lower-triangular group pairs, g(g+1)/2 for g ciphertext groups,
    so circuit size grows quadratically in group count while token count grows linearly. This is
    arithmetic on the packing layout, not a timing model.

tasks:

