# Resource trace of the measured encrypted block
#
# Sampled every 5 s during the run and thinned here to the reported points. This is the raw
# material for the stage-timeline figure, which is the strongest single piece of evidence for
# the architecture: it shows GPU utilization collapsing to 1-2 percent during the client stage,
# and the host memory curve tracking the caching strategy exactly.
#
# Source: docs/hybrid/t123_walkthrough.md §8.

meta:
  updated: 2026-08-08
  total_wall_s: 663
  sample_interval_s: 5
  gpu: "NVIDIA A100, 40 GB"
  cores: 32
  tag: "[V]"

# t_s      seconds since process start
# gpu_mib  GPU memory used by the evaluating process
# gpu_pct  GPU utilization
# rss_mib  host resident set size
# load1    host one-minute load average, partly this process's own threads
# stage    which phase of the block is running

