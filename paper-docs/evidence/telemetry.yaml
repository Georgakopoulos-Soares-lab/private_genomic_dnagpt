# Stage bands, for shading the timeline figure.
stages:
  - {id: qkv,                  label: "LayerNorm + query/key/value projection", start_s: 0,   end_s: 115, executor: server}
  - {id: attention_scores,     label: "Causal attention scores",                start_s: 125, end_s: 330, executor: mixed}
  - {id: attention_context,    label: "Attention context",                      start_s: 330, end_s: 460, executor: client}
  - {id: attention_projection, label: "Attention projection + residual",        start_s: 460, end_s: 500, executor: server}
  - {id: mlp,                  label: "LayerNorm + MLP with GELU",              start_s: 500, end_s: 655, executor: server}
  - {id: decrypt,              label: "Final decrypt",                          start_s: 655, end_s: 663, executor: client}

# What the trace shows, stated once so figure captions can stay short.
readings:
  - id: read.sampled_gpu_underutilization
    tag: "[V]"
    statement: >
      GPU utilization never exceeds 40 percent and falls to 1-2 percent for roughly 90 seconds
      during the attention context stage in the sampled single-block trace. This establishes
      underutilization during the observation window, but it does not identify a causal
      bottleneck; launch overhead, synchronization, memory movement, host encoding, and client
      work require a current CPU/CUDA profile to separate.
  - id: read.memory_is_the_design
    tag: "[V]"
    statement: >
      The host memory curve reads directly as the caching strategy: it rises while a stage's
      weight matrices are cached, drops at each stage flush, and peaks in the MLP stage, which
      holds the most matrices.
  - id: read.client_stage_is_idle_gpu
    tag: "[A]"
    statement: >
      The stage with the lowest GPU utilization is also the stage still performing the most
      redundant host encoding. The co-location motivates profiling and a mask-plaintext-cache
      experiment; the utilization trace alone does not attribute wall time to that work.

# ---------------------------------------------------------------------------
# Contention check for the complete-model run of 2026-08-12
#
# This section records a whole-node allocation with no contention detected in the available
# telemetry. It does not claim scheduler exclusivity, because the job omitted --exclusive.
#
# Source: results/runs/fhe_fides_real_d768_t103_12blocks_head_cpudiagcache_t123_v3_scheme_b_a100_20260812
#         {_telemetry.csv, _slurm.out}
# ---------------------------------------------------------------------------

complete_model_contention:
  meta:
    updated: 2026-08-13
    total_wall_s: 6683
    samples: 653
    gpu: "NVIDIA A100-PCIE-40GB"
    cores: 32
    tag: "[V]"

  checks:
    - id: clean.whole_node_partition
      tag: "[V]"
      statement: >
        The job ran in the whole-node A100 partition, not the shared per-GPU partition that the
        earlier contended single-block runs used. All three of the node's A100 devices were
        visible to this job, which is what a whole-node allocation looks like.
      source: "batch script: #SBATCH -p gpu-a100; slurm.out device enumeration"
      caveat: >
        The script does not request --exclusive, so exclusivity rests on the partition's
        allocation policy rather than on a flag recorded in the artifact.
    - id: clean.node_empty_at_allocation
      tag: "[V]"
      statement: >
        All three A100 devices reported 0 MiB used and 0 percent utilization when the job
        started, so no co-tenant was present at allocation.
      source: "slurm.out header"
    - id: clean.other_gpus_are_our_own_contexts
      tag: "[A]"
      statement: >
        The other two devices sit at exactly 850 MiB from 42 s onward. At that same sample the
        evaluating device first shows 425 MiB, and 850 = 2 x 425: the two idle devices each hold
        one CUDA context the size of this process's own, created when it enumerated all visible
        devices. A co-tenant's footprint would neither equal twice ours nor stay constant for
        the remaining 6,600 s.
      source: >
        telemetry CSV: gpu0_mem_used_mib and gpu_others_mem_mib at elapsed_s = 42; constant
        across 649 of 653 samples. Device enumeration at [42 s] in the run log.
    - id: clean.no_cpu_oversubscription
      tag: "[A]"
      statement: >
        Host one-minute load average peaks at 29.1 while this job requested 32 threads, and the
        per-process busy-core figure peaks at 26.8. Load never rises to a level that would
        indicate the node's cores were oversubscribed during the run.
      source: "telemetry CSV: host_load1 and cpu_cores_busy, max over 653 samples"
      caveat: >
        host_load1 is a decayed node-wide average and cpu_cores_busy is an instantaneous
        per-process sample, so the two cannot be differenced to isolate a co-tenant. The node's
        total core count is not recorded in any committed artifact, so 32 is a thread request
        and not the denominator.
    - id: clean.gpu_headroom_persists_at_full_model
      tag: "[V]"
      statement: >
        GPU utilization has median 32 percent and maximum 51 percent across the complete model,
        establishing sampled accelerator underutilization at whole-model scale. These values do
        not by themselves identify the limiting CPU, CUDA, memory-transfer, launch, or dependency
        mechanism.
      source: "telemetry CSV: gpu0_util_pct"
    - id: clean.memory_flat_across_blocks
      tag: "[A]"
      statement: >
        GPU memory rises during context and key loading, reaches 9839 MiB at about 400 s, and
        then holds exactly that value for the remaining 94 percent of the run. It does not grow
        with block index, so composition through client refresh accumulates no accelerator
        memory across the twelve blocks.
      source: "telemetry CSV: gpu0_mem_used_mib, constant at 9839 from elapsed_s = 400"

