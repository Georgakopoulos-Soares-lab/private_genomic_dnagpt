# Where the boundary traffic actually is. Softmax dominates; LayerNorm and GELU are rounding
# error by comparison. Derived from the per-boundary counters in the driver.
boundary_decomposition:
  - id: boundary.layernorm_instances
    value: 206
    tag: "[A]"
    scope: "Inverse-square-root values crossing at both LayerNorm sites (103 each)"
    source: "derived from the boundary counters; verified in context/08_implementation_ground_truth.md"
  - id: boundary.gelu_instances
    value: 412
    tag: "[A]"
    scope: "GELU values crossing, equal to T x COPIES"
    source: "derived; t123 driver gelu_boundary accumulates active x COPIES per group"
  - id: boundary.softmax_instances
    value: 128544
    tag: "[A]"
    scope: >
      Attention values crossing: 64,272 scores decrypted plus 64,272 weights re-encrypted,
      each equal to HEADS x T(T+1)/2.
    source: "derived; verified against the driver's counters"
  - id: boundary.softmax_share_pct
    value: 99.5
    unit: "%"
    tag: "[A]"
    scope: >
      Softmax share of all logical values crossing the boundary. The attention nonlinearity is
      the boundary cost; LayerNorm and GELU together are under one percent.
    source: "derived from the three rows above and ops.client_instances_logical"

