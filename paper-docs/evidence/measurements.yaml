    source: "docs/hybrid/t123_walkthrough.md Appendix"
  - id: layout.heads
    value: 12
    tag: "[V]"
    scope: "Attention heads"
    source: "docs/hybrid/t123_walkthrough.md Appendix"
  - id: layout.head_dim
    value: 64
    tag: "[V]"
    scope: "Dimensions per head"
    source: "docs/hybrid/t123_walkthrough.md Appendix"
  - id: layout.mlp_width
    value: 3072
    tag: "[V]"
    scope: "MLP expansion width"
    source: "docs/hybrid/t123_walkthrough.md Appendix"
  - id: layout.pack_width
    value: 1024
    tag: "[V]"
    scope: "768 padded to a power of two for the baby-step giant-step transform"
    source: "docs/hybrid/t123_walkthrough.md Appendix"
  - id: layout.copies
    value: 4
    tag: "[V]"
    scope: "Activation copies per ciphertext, equal to MLP width divided by hidden width"
    source: "docs/hybrid/t123_walkthrough.md Appendix"
  - id: layout.token_lanes
    value: 8
    tag: "[V]"
    scope: "Tokens packed per ciphertext"
    source: "docs/hybrid/t123_walkthrough.md Appendix"
  - id: layout.token_groups
    value: 13
    tag: "[V]"
