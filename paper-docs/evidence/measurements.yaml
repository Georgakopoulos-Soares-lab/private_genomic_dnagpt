# Paper measurement ledger
#
# Every number that may appear in the manuscript lives here, once, with its source.
# The figure scripts read this file. The number lint (scripts/check_numbers.py) reads this file.
# If a number is not here, it does not go in the paper.
#
# tag:  [V] measured   [U] unresolved/not measured   [A] assumed or derived
# scope: what the number is actually about. Never widen a scope when quoting.
#
# Deliberately absent: SHA-256 fixture hashes, run identifiers, manifest rows, gate tokens,
# host names, scheduler job numbers. Those are development bookkeeping, not scientific content.

meta:
  updated: 2026-09-07
  encrypted_scope: >
    The strongest measurement is one complete DNAGPT-0.1b genomic-signal classifier: all twelve
    transformer blocks and the released task head evaluated at the full 103-token prompt length.
    The encrypted boundary begins at embedded vectors and excludes private token-index lookup.
  hardware: >
    One telemetry-confirmed clean NVIDIA A100 GPU (40 GB) with 32 CPU cores. The allocation did
    not establish exclusive use of the physical node.
  acceptance: >
    A run passes when the decrypted output matches the frozen plaintext reference within a
    relative infinity-norm tolerance of 4e-2.

