# ---------------------------------------------------------------------------
# 2. Circuit invariants
#
# These are identical before and after every optimization in the campaign. They are what
# makes the speedup attributable to systems work rather than to a weakened circuit.
# ---------------------------------------------------------------------------

ops:
  - id: ops.dense_products
    value: 156
    unit: "dense encrypted matrix products"
    tag: "[V]"
    scope: "One block at 103 tokens with eight-token packing"
    source: "docs/hybrid/roadmap.md, docs/hybrid/t123_walkthrough.md"
  - id: ops.dense_products_unpacked
    value: 1236
    unit: "dense encrypted matrix products"
    tag: "[A]"
    scope: "Serial-equivalent count for the same block without token packing"
    source: "docs/hybrid/roadmap.md"
  - id: ops.packing_reduction_factor
    value: 7.92
    unit: "x"
    tag: "[A]"
    scope: >
      Structural reduction in dense products from eight-token packing. This is an operation
      count, not a latency measurement, and must never be quoted as a speedup.
    source: "derived from ops.dense_products and ops.dense_products_unpacked"
  - id: ops.ct_pt_multiplications
    value: 177734
    unit: "ciphertext-plaintext multiplications"
    tag: "[V]"
    scope: "One block at 103 tokens"
    source: "docs/hybrid/roadmap.md, docs/hybrid/t123_walkthrough.md"
  - id: ops.ct_ct_multiplications
    value: 1506
    unit: "ciphertext-ciphertext multiplications"
    tag: "[V]"
    scope: "One block at 103 tokens"
    source: "docs/hybrid/roadmap.md, docs/hybrid/t123_walkthrough.md"
  - id: ops.rotations
    value: 8173
    unit: "explicit rotations"
    tag: "[V]"
    scope: "One block at 103 tokens"
    source: "docs/hybrid/roadmap.md"
  - id: ops.reductions
    value: 8776
    unit: "reduction calls"
    tag: "[V]"
    scope: "One block at 103 tokens"
    source: "docs/hybrid/roadmap.md"
  - id: ops.client_crossings_physical
    value: 857
    unit: "boundary crossings"
    tag: "[V]"
    scope: "Physical decrypt/evaluate/re-encrypt operations performed by the data owner"
    source: "docs/hybrid/t123_walkthrough.md"
  - id: ops.client_instances_logical
    value: 129162
    unit: "heterogeneous logical-instance counter"
    tag: "[V]"
    scope: >
      Implementation-declared schedule counter. LayerNorm increments it by active tokens,
      GELU by active token-copies, and attention by head/query/key scalars. These units are not
      homogeneous, so the total is not a scalar-work, traffic, or cost count.
    source: "docs/hybrid/t123_walkthrough.md"
  - id: ops.score_tile_decryptions
    value: 91
    unit: "decryptions"
    tag: "[V]"
    scope: "Causal attention score tiles returned to the client for exact softmax"
    source: "docs/hybrid/t123_walkthrough.md"
  - id: ops.weight_tile_encryptions
    value: 727
    unit: "encryptions"
    tag: "[V]"
    scope: "Attention weight tiles re-encrypted by the client"
    source: "docs/hybrid/t123_walkthrough.md"

# Counter decomposition and homogeneous boundary-schedule measures. The three instance counters
# use different units and must not be divided into shares. Call and ciphertext-object shares are
# homogeneous and support the statement that attention dominates the boundary schedule.
boundary_decomposition:
  - id: boundary.layernorm_instances
    value: 206
    tag: "[A]"
    scope: >
      LayerNorm contribution to the heterogeneous counter: active tokens at both LayerNorm sites
      (103 each). The server computes mean, centered square, variance, normalization
      multiplication, and scale; only the inverse square root is client-evaluated.
    source: "derived from the boundary counters; verified in context/08_implementation_ground_truth.md"
  - id: boundary.gelu_instances
    value: 412
    tag: "[A]"
    scope: "GELU contribution to the heterogeneous counter: active tokens times packed copies"
    source: "derived; t123 driver gelu_boundary accumulates active x COPIES per group"
  - id: boundary.softmax_instances
    value: 128544
    tag: "[A]"
    scope: >
      Attention contribution to the heterogeneous counter: 64,272 score scalars consumed plus
      64,272 weight scalars emitted, each equal to HEADS x T(T+1)/2.
    source: "derived; verified against the driver's counters"
  - id: boundary.attention_client_calls
    value: 818
    unit: "client calls"
    tag: "[A]"
    scope: "91 score-tile decryptions plus 727 attention-weight encryptions"
    source: "derived from ops.score_tile_decryptions and ops.weight_tile_encryptions"
  - id: boundary.attention_call_share_pct
    value: 95.4
    unit: "%"
    tag: "[A]"
    scope: >
      Attention-related share of the 857 homogeneous per-block client-call count: 818 / 857.
    source: "derived from boundary.attention_client_calls and ops.client_crossings_physical"
  - id: boundary.block_ciphertext_objects
    value: 896
    unit: "ciphertext objects"
    tag: "[A]"
    scope: "All server-to-client and client-to-server boundary ciphertext objects for one block"
    source: "derived from communication block-direction rows"
  - id: boundary.attention_ciphertext_objects
    value: 818
    unit: "ciphertext objects"
    tag: "[A]"
    scope: "91 score ciphertexts sent to the client plus 727 weight ciphertexts returned"
    source: "derived from the checked attention boundary schedule"
  - id: boundary.attention_ciphertext_share_pct
    value: 91.3
    unit: "%"
    tag: "[A]"
    scope: "Attention-related share of the 896 per-block boundary ciphertext objects: 818 / 896"
    source: "derived from the preceding two rows"

ct_ct_decomposition:
  - id: ctct.layernorm_centered_sq
    value: 26
    tag: "[V]"
    scope: "LayerNorm centered x centered"
    source: "docs/hybrid/t123_walkthrough.md §3.1"
  - id: ctct.layernorm_centered_inverse
    value: 26
    tag: "[V]"
    scope: "LayerNorm centered x client-returned inverse"
    source: "docs/hybrid/t123_walkthrough.md §3.1"
  - id: ctct.query_key
    value: 727
    tag: "[V]"
    scope: "Query x shifted key"
    source: "docs/hybrid/t123_walkthrough.md §3.1"
  - id: ctct.weight_value
    value: 727
    tag: "[V]"
    scope: "Attention weight x shifted value"
    source: "docs/hybrid/t123_walkthrough.md §3.1"
  - id: ctct.attention_share_pct
    value: 97
    unit: "%"
    tag: "[A]"
    scope: "Share of ciphertext-ciphertext multiplications that live in attention"
    source: "derived from the four rows above"

# ---------------------------------------------------------------------------
# 3. Cryptographic and layout parameters
# ---------------------------------------------------------------------------

# The reference the encrypted run reproduces was itself validated against the released model.
# Both stages belong in the paper; reporting only the second invites the objection that the
# circuit and its reference could be wrong together.
oracle_chain:
  - id: oracle.reference_vs_upstream_tolerance
    value: 2e-5
    tag: "[V]"
    scope: >
      Tolerance at which the independent NumPy float64 block reference is asserted equal to the
      float64-cast shadow of the upstream PyTorch block, per block, for all twelve blocks, and
      for the classifier head. The export aborts on divergence. This is not a direct comparison
      with the released model's default float32 forward path.
    source: "fhe/multiblock/export_fixture_t103.py:175-198, 224-240"
  - id: oracle.numpy_vs_float64_shadow_max_block_abs
    value: 5.22e-6
    unit: "absolute"
    tag: "[V]"
    scope: >
      Largest per-block absolute difference between the independent NumPy float64 lineage and
      the float64-cast PyTorch shadow in the frozen 103-token reference.
    source: >
      results/runs/fhe_multiblock_t103_precision_contract_20260814.json:
      oracle_gate.max_block_abs_error_numpy_vs_float64_shadow
  - id: oracle.numpy_vs_released_float32_max_block_abs
    value: 7.997e-4
    unit: "absolute"
    tag: "[V]"
    scope: >
      Largest observed absolute activation difference between the independent NumPy float64
      lineage and the released model's default float32 lineage across the twelve 103-token
      blocks. This diagnostic drift exceeds the float64-shadow all-close tolerance but does not
      change the evaluated class label.
    source: >
      results/runs/fhe_multiblock_t103_precision_contract_20260814.json:
      oracle_gate.max_block_abs_error_numpy_vs_released_float32; recorded by
      fhe/multiblock/export_fixture_t103.py:183-211
  - id: oracle.released_float32_margin
    value: 12.2666015625
    tag: "[V]"
    scope: "Released float32 model's full-prompt classification margin"
    source: >
      results/runs/fhe_multiblock_t103_precision_contract_20260814.json and
      results/runs/fhe_multiblock_plaintext_contract_20260724.json
  - id: oracle.released_float32_label
    value: "N"
    tag: "[V]"
    scope: "Released float32 model's full-prompt class label"
    source: "results/runs/fhe_multiblock_t103_precision_contract_20260814.json: classification"
  - id: full.margin_rel_error_vs_released_float32
    value: 1.61e-6
    unit: "relative"
    tag: "[A]"
    scope: >
      Relative difference between the decrypted encrypted margin and the released model's
      default float32 full-prompt margin. Both the float32 and float64 reference lineages assign
      label N to the evaluated prompt.
    source: >
      derived from the encrypted run head margin and
      results/runs/fhe_multiblock_t103_precision_contract_20260814.json
  - id: input.gsr_record_index
    value: 0
    tag: "[V]"
    scope: "Zero-based record index selected by the 103-token exporter"
    source: "fhe/multiblock/export_fixture_t103.py:139-150"
  - id: input.gsr_selection_rule
    value: "first record in the verified positive GSR FASTA input"
    tag: "[V]"
    scope: >
      Deterministic input-selection rule used by the 103-token exporter. This is one deliberately
      selected positive-file record, not a random or margin-stratified sample.
    source: "fhe/multiblock/export_fixture_t103.py:142-150"
  - id: input.gsr_class
    value: "positive / real GSR"
    tag: "[V]"
    scope: "Source-corpus class of the single prompt selected for encrypted evaluation"
    source: "results/runs/fhe_multiblock_t103_precision_contract_20260814.json: classification"
  - id: boundary.layernorm_client_function
    value: "inverse square root only"
    tag: "[V]"
    scope: "The only LayerNorm function evaluated at the client boundary"
    source: "context/08_implementation_ground_truth.md Algorithm 2"
  - id: oracle.released_model_has_no_biases
    value: true
    tag: "[V]"
    scope: >
      The evaluated 0.1b checkpoint carries no bias tensors. The checkpoint is loaded with its
      missing-key set asserted exactly, so a bias expected by the module but absent would fail
      that assertion. The encrypted circuit omits biases because the model has none.
    source: "fhe/realweights/contract.py:38-53; fhe/multiblock/export_fixture_t103.py:366"
  - id: oracle.reencryption_level
    value: 0
    tag: "[V]"
    scope: >
      Every client boundary returns a ciphertext at level 0, so each crossing fully resets the
      multiplicative budget. Depth therefore bounds the longest run between two boundaries, not
      the depth of the network -- which is why depth 13 suffices for a twelve-block model.
    source: "t123 driver, all four boundary methods"

