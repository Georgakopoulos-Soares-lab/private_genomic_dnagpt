    scope: "Usable plaintext slots per ciphertext"
    source: "docs/hybrid/t123_walkthrough.md Appendix"
  - id: param.multiplicative_depth
    value: 13
    tag: "[V]"
    scope: >
      Smallest demonstrated passing depth at the retained scale, digit count, ring, and
      packing. Not a claim that depth 13 is faster than other depths.
    source: "docs/hybrid/roadmap.md, docs/hybrid/t123_walkthrough.md Appendix"
  - id: param.level_at_block_end
    value: 6
    tag: "[V]"
    scope: "Levels remaining of 13 when the block completes"
    source: "docs/hybrid/t123_walkthrough.md"
  - id: param.key_switch_digits
