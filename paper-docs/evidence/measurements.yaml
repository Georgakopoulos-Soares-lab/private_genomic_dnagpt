  - id: layout.bsgs_split
    value: "32 x 32"
    tag: "[V]"
    scope: "Baby-step giant-step decomposition of the 1024-wide transform"
    source: "docs/hybrid/t123_walkthrough.md Appendix"

# ---------------------------------------------------------------------------
# 4. Prompt length derivation
#
# 103 is arithmetic, not a design choice. State the derivation whenever the number appears.
# ---------------------------------------------------------------------------

prompt_length:
  - id: prompt.gsr_basepairs
    value: 600
    unit: bp
    tag: "[V]"
    scope: "Genomic signal recognition input window"
    source: "docs/tasks.md, Kimon tokenization table"
  - id: prompt.kmer
    value: 6
    tag: "[V]"
    scope: "DNAGPT tokenizes non-overlapping chunks with stride six"
    source: "DNAGPT upstream tokenizer"
  - id: prompt.gsr_kmer_tokens
    value: 100
    tag: "[V]"
    scope: "600 bp divided by 6"
    source: "Kimon tokenization table"
  - id: prompt.gsr_special_tokens
    value: 3
    tag: "[V]"
    scope: "Task-format special tokens surrounding the sequence"
    source: "Kimon tokenization table"
  - id: prompt.gsr_total
    value: 103
    unit: tokens
    tag: "[V]"
    scope: "Complete tokenized genomic-signal prompt; the encrypted anchor length"
    source: "derived: 600 / 6 + 3"

# ---------------------------------------------------------------------------
# 5. Plaintext reference model (Phase A) — the oracle the encrypted run must reproduce
# ---------------------------------------------------------------------------

plaintext_baseline:
  - id: base.gsr_accuracy
    value: 0.9124
    tag: "[V]"
    scope: "Human polyadenylation-signal recognition, released classification head, n = 22,604"
    reference: 0.9151
    reference_name: "DNAGPT"
    reference_scope: >
      DNAGPT's own reported accuracy for the 0.1B "M" variant on human PAS(AATAAA)
      (its Table S2), measured on a held-out test split of roughly a quarter of the
      set (train:val:test = 6:1.5:2.5). This work evaluates the full 22,604-example
      balanced set, so the comparison is same-model but not same-split.
    source: "docs/tasks.md; reference corrected in reviews/2026-08-08-paper-sources.md"
  - id: base.gsr_f1
    value: 0.916
    tag: "[V]"
    scope: "Same run as base.gsr_accuracy"
    source: "docs/tasks.md"
  - id: base.gsr_n
    value: 22604
    tag: "[V]"
    scope: "Canonical test split size"
    source: "docs/tasks.md"
  - id: base.gue_prom_core_mcc
    value: 0.680
    tag: "[V]"
    scope: "Core promoter detection, locally fine-tuned head"
    reference: 0.69
    reference_name: "DNABERT-2"
    source: "docs/tasks.md"
  - id: base.gue_prom_300_mcc
    value: 0.897
    tag: "[V]"
    scope: "300 bp promoter detection, locally fine-tuned head; exceeds the reference"
    reference: 0.87
    reference_name: "DNABERT-2"
    source: "docs/tasks.md"
  - id: base.gue_splice_mcc
    value: 0.831
    tag: "[V]"
    scope: "Reconstructed splice-site classification, locally fine-tuned head"
    reference: 0.85
    reference_name: "DNABERT-2"
    source: "docs/tasks.md"
  - id: base.mrna_r2
    value: 0.562
    tag: "[V]"
    scope: >
      Human mRNA abundance regression, released head, n = 1,000. Model-fidelity evidence only;
      this task is outside the encrypted scope.
    reference: 0.62
    reference_name: "DNAGPT"
    source: "docs/tasks.md"
  - id: base.mrna_pearson
    value: 0.753
    tag: "[V]"
    scope: "Same run as base.mrna_r2"
    source: "docs/tasks.md"
  - id: base.mrna_xpresso_r2
    value: 0.59
    tag: "[V]"
    scope: >
      Xpresso's own published human mRNA-abundance r^2 (Agarwal & Shendure 2020, Cell Reports
      31(7):107663, Table 1). Not measured in this work; quoted only so the manuscript can
      distinguish the Xpresso baseline from DNAGPT's 0.62 on the Xpresso dataset
      (the reference on base.mrna_r2).
    source: "refs.bib:xpresso; reviews/2026-09-13-citation-corrections.md"

# ---------------------------------------------------------------------------
# 6. Non-interactive baseline (the architecture that was set aside)
# ---------------------------------------------------------------------------

non_interactive:
  - id: noninteractive.block_closed
    value: true
    tag: "[V]"
    scope: >
      A fully non-interactive configuration, with polynomial approximations of every
      nonlinearity and no intermediate decryption, completed one real-weight block.
    source: "docs/pure/measurements.md"
  - id: noninteractive.memory_envelope
    value: 80
    unit: GB
    tag: "[V]"
    scope: >
      GPU memory available in the tested configuration. Chained multi-block composition
      exceeded this envelope during context and evaluation-key loading.
    source: "docs/pure/measurements.md, docs/shared/architecture_options.md"
    notes: >
      Scoped to the chosen library, parameters, packing, and hardware. Not an impossibility
      result for non-interactive CKKS.

# ---------------------------------------------------------------------------
# 7. Composition
# ---------------------------------------------------------------------------

composition:
  - id: compose.two_block_error
    value: 8.48e-11
    unit: "relative infinity norm"
    tag: "[V]"
    scope: >
      Two consecutive released blocks composed at two tokens through a full-hidden-state
      client refresh. Error after the second block.
    source: "docs/hybrid/tasks.md"
  - id: compose.two_block_memory_growth
    value: false
    tag: "[V]"
    scope: "GPU memory peaked in the first block and did not increase in the second"
    source: "docs/hybrid/tasks.md"
  - id: compose.twelve_block_at_task_length
    value: true
    tag: "[V]"
    scope: >
      All twelve released transformer blocks and the released genomic-signal task head pass at
      103 tokens; the final label matches the frozen plaintext reference.
    source: "docs/hybrid/tasks.md, Complete 12-block + GSR-head encrypted forward pass"
  - id: compose.full_run_repeat
    value: null
    tag: "[U]"
    scope: "The complete clean run has not yet been independently repeated to quantify variance"
    source: "docs/overview.md; docs/hybrid/roadmap.md"
  - id: compose.network_transport
    value: null
    tag: "[U]"
    scope: >
      No networked client/server transport has been implemented or measured; every recorded
      boundary crossing is an in-process cryptographic operation.
    source: "docs/overview.md; docs/hybrid/roadmap.md"
