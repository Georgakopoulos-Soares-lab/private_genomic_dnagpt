# ---------------------------------------------------------------------------
# 8. Complete model: twelve blocks and the released task head at task length
#
# One whole-node sample with no contention detected in recorded telemetry, 2026-08-12, on one
# A100 GPU node using 32 CPU threads.
# The node was empty at allocation and the retained telemetry detects no competing activity;
# see telemetry.yaml for the precise evidence and scheduler caveat.
#
# NOT REPRODUCED. This is a single execution. Every timing row below carries n = 1 and
# no summary statistic. Report it as one measured sample, never as a mean or a rate.
# ---------------------------------------------------------------------------

complete_model:
  # --- outcome ---
  - id: full.passed
    value: true
    tag: "[V]"
    scope: >
      Encrypted prediction accepted against the frozen plaintext reference at the
      pre-declared tolerance of 4e-2, unchanged from the block experiments.
    source: "run JSON: passed"
  - id: full.label_matches
    value: true
    tag: "[V]"
    scope: >
      Decrypted class label matches the manual float64 reference; the T=103 reference manifest
      separately records that the manual float64 and released float32 full-prompt paths both
      assign label N
    source: >
      run JSON: head.label_matches; T=103 reference manifest:
      classification.complete_public_prompt_reference
  - id: full.encrypted_examples
    value: 1
    tag: "[V]"
    scope: "Number of selected prompts evaluated by the complete encrypted model"
    source: "complete-run artifact and T=103 reference manifest"
  - id: full.encrypted_margin
    value: 12.266581857561365
    tag: "[V]"
    scope: "Decrypted encrypted-execution classification margin"
    source: "run JSON: head.decrypted_margin_n_minus_a"
  - id: full.encrypted_label
    value: "N"
    tag: "[V]"
    scope: "Decrypted encrypted-execution class label"
    source: "run JSON: head.label"
  - id: full.margin_rel_error
    value: 8.56e-09
    unit: "relative"
    tag: "[V]"
    scope: >
      Decrypted classification margin against the manual NumPy float64 reference margin. The
      ratio to the 4e-2 acceptance tolerance is 6.67 orders of magnitude. Exact recorded value
      8.55814015132133e-09; quote at three significant figures.
    source: "run JSON: head.margin_rel_error"
  - id: full.margin_headroom_orders
    value: 6.67
    unit: "orders of magnitude"
    tag: "[A]"
    scope: "log10(4e-2 / 8.55814015132133e-09)"
    source: "derived from err.tolerance and full.margin_rel_error"
  - id: full.margin_headroom_ratio
    value: 4.67e6
    tag: "[A]"
    scope: "4e-2 divided by 8.55814015132133e-09"
    source: "derived from err.tolerance and full.margin_rel_error"
  - id: full.margin_abs_error
    value: 1.05e-07
    tag: "[V]"
    scope: >
      Absolute deviation of the decrypted margin from the oracle margin. Exact recorded value
      1.049791276130918e-07; quote at three significant figures.
    source: "run JSON: head.margin_abs_error"

  # --- timing, n = 1 ---
  - id: full.wall
    value: 6683
    unit: s
    tag: "[V]"
    scope: "Process start to process end. Single sample; 1.86 h"
    source: "run JSON + slurm.out: wall_clock_s"
  - id: full.wall_hours
    value: 1.86
    unit: h
    tag: "[A]"
    scope: "6683 s expressed in hours"
    source: "derived from full.wall"
  - id: full.encrypted_evaluation
    value: 6594.748
    unit: s
    tag: "[V]"
    scope: "Encrypted evaluation only; 98.68% of wall clock"
    source: "run JSON: timings_seconds.encrypted_evaluation"
  - id: full.server_linear_algebra
    value: 5638.561
    unit: s
    tag: "[V]"
    scope: >
      Residual provider-side encrypted-evaluation bucket: GPU-backend work plus its host
      preparation, synchronization, and evaluator overhead; 85.5% of encrypted evaluation
    source: "run JSON: timings_seconds.server_linear_algebra_seconds"
  - id: full.client_boundaries
    value: 956.187
    unit: s
    tag: "[V]"
    scope: "Client decrypt / exact evaluate / re-encrypt, CPU only; 14.5% of encrypted evaluation"
    source: "run JSON: timings_seconds.client_boundary_seconds_total"
  - id: full.blocks_evaluation
    value: 6565.993
    unit: s
    tag: "[V]"
    scope: "The twelve transformer blocks, excluding the head and the inter-block refreshes"
    source: "run JSON: timings_seconds.blocks_encrypted_evaluation"
  - id: full.head_evaluation
    value: 9.046
    unit: s
    tag: "[V]"
    scope: "Encrypted task head: final LayerNorm, head linear, SiLU, head LayerNorm, margin"
    source: "run JSON: timings_seconds.head_encrypted_evaluation"
  - id: full.refreshes
    value: 19.710
    unit: s
    tag: "[V]"
    scope: "The twelve client refreshes between blocks and into the head"
    source: "run JSON: timings_seconds.refreshes"
  - id: full.context_keygen_load
    value: 3.945
    unit: s
    tag: "[V]"
    scope: "Crypto context construction, key generation, and GPU key upload"
    source: "run JSON: timings_seconds.context_keygen_load"
  - id: full.fixture_load
    value: 23.494
    unit: s
    tag: "[V]"
    scope: "Reading released weights, embeddings, and the verified reference from disk"
    source: "run JSON: timings_seconds.load_verified_fixture"
  - id: full.encrypt_input
    value: 1.265
    unit: s
    tag: "[V]"
    scope: "Encrypting the embedded input token vectors"
    source: "run JSON: timings_seconds.encrypt_embedded_inputs"
  - id: full.final_decrypt
    value: 0.044
    unit: s
    tag: "[V]"
    scope: "Single final decryption of the classification margin"
    source: "run JSON: timings_seconds.final_decrypt"
  - id: full.uninstrumented_remainder
    value: 59.504
    unit: s
    tag: "[A]"
    scope: >
      Wall clock minus the sum of the instrumented phases, 0.89% of wall. The instrumented
      phases are an incomplete decomposition, not a partition; this row keeps the table
      honest rather than letting the phases appear to sum to the wall clock.
    source: "derived: 6683 - 6623.496"
  - id: full.mean_per_block
    value: 547.166
    unit: s
    tag: "[A]"
    scope: >
      Blocks evaluation divided by twelve. An average over the twelve blocks of a single run,
      not twelve independent runs.
    source: "derived from full.blocks_evaluation"
  - id: full.block_eval_min
    value: 533.869
    unit: s
    tag: "[V]"
    scope: "Fastest of the twelve per-block evaluation times (block 0)"
    source: "run JSON: blocks[].evaluation_seconds"
  - id: full.block_eval_max
    value: 558.943
    unit: s
    tag: "[V]"
    scope: "Slowest of the twelve per-block evaluation times (block 6)"
    source: "run JSON: blocks[].evaluation_seconds"
  - id: full.block_eval_spread_pct
    value: 4.7
    unit: "%"
    tag: "[A]"
    scope: >
      Range of the twelve per-block times as a percentage of the fastest. Within-run spread
      across architecturally identical blocks on one node; not run-to-run variance.
    source: "derived from full.block_eval_min and full.block_eval_max"

  # --- per-block hidden-state error, the comparable quantity to the single-block figure ---
  # The block experiments report a hidden-state relative infinity norm. The complete-model
  # headline (full.margin_rel_error) is a scalar margin error and is NOT the same quantity.
  # These rows carry the comparable series so the two are never placed in one column.
  - id: full.hidden_error_first_block
    value: 4.09e-09
    unit: "relative infinity norm"
    tag: "[V]"
    scope: "Hidden state after block 0 versus the plaintext reference"
    source: "run JSON: blocks[0].refresh_metrics.global_rel_inf"
  - id: full.hidden_error_last_block
    value: 2.07e-08
    unit: "relative infinity norm"
    tag: "[V]"
    scope: >
      Hidden state after block 11, the largest value in the twelve-block series. Six orders of
      magnitude inside the 4e-2 acceptance tolerance.
    source: "run JSON: blocks[11].refresh_metrics.global_rel_inf"
  - id: full.max_abs_error_last_block
    value: 7.97e-06
    unit: "absolute"
    tag: "[V]"
    scope: >
      Largest absolute hidden-state deviation after block 11, against 6.56e-08 after block 0:
      absolute error grows by roughly two orders of magnitude across the twelve blocks.
    source: "run JSON: blocks[11].refresh_metrics.max_abs_error"

  # --- shares, derived ---
  - id: full.server_share_of_eval
    value: 85.5
    unit: "%"
    tag: "[A]"
    scope: "Provider-side residual bucket as a share of encrypted evaluation"
    source: "derived from full.server_linear_algebra and full.encrypted_evaluation"
  - id: full.client_share_of_eval
    value: 14.5
    unit: "%"
    tag: "[A]"
    scope: >
      Client share of encrypted evaluation. Server and client sum exactly to encrypted
      evaluation, so this decomposition has no unaccounted remainder.
    source: "derived from full.client_boundaries and full.encrypted_evaluation"
  - id: full.server_share_of_wall
    value: 84.4
    unit: "%"
    tag: "[A]"
    scope: "Provider-side encrypted evaluation as a share of wall clock"
    source: "derived from full.server_linear_algebra and full.wall"
  - id: full.client_share_of_wall
    value: 14.3
    unit: "%"
    tag: "[A]"
    scope: "Client boundaries as a share of wall clock"
    source: "derived from full.client_boundaries and full.wall"
  - id: full.eval_share_of_wall
    value: 98.68
    unit: "%"
    tag: "[A]"
    scope: "Encrypted evaluation as a share of wall clock"
    source: "derived from full.encrypted_evaluation and full.wall"

  # --- protocol traffic ---
  - id: full.crossings_physical
    value: 10299
    tag: "[V]"
    scope: >
      In-process cryptographic boundary calls across the complete model. These are not network
      messages and do not determine serialized byte volume.
    source: "run JSON: protocol.round_trips"
  - id: full.crossings_nonlinearity
    value: 10286
    tag: "[V]"
    scope: >
      Twelve blocks' nonlinear boundary calls plus the two head inverse-square-root calls. This
      shared-client counter excludes eleven inter-block refreshes, the head-input refresh, and
      head SiLU.
    source: "run JSON: protocol.nonlinearity_round_trips"
  - id: full.refresh_crossings
    value: 11
    tag: "[V]"
    scope: "Full-hidden-state refreshes between consecutive blocks"
    source: "run JSON: composition.inter_block_full_hidden_refreshes"
  - id: full.logical_boundary_instances
    value: 1551081
    unit: "heterogeneous logical-instance counter"
    tag: "[V]"
    scope: >
      Implementation-declared schedule counter with heterogeneous per-boundary units; includes
      LayerNorm tokens, GELU token-copies, attention head/query/key scalars, and refresh-token
      instances. It is not a scalar-work, traffic, or cost count.
    source: "run JSON: protocol.logical_boundary_instances"
  - id: full.client_per_crossing
    value: 0.0928
    unit: s
    tag: "[A]"
    scope: "956.187 s divided by 10,299 physical crossings"
    source: "derived from full.client_boundaries and full.crossings_physical"

  # --- circuit ---
  - id: full.bootstraps
    value: 0
    tag: "[V]"
    scope: >
      No homomorphic bootstrap anywhere in the complete model. Client re-encryption resets
      the depth budget at declared boundaries instead.
    source: "run JSON: config.bootstraps"
  - id: full.depth
    value: 13
    tag: "[V]"
    scope: "Multiplicative depth, unchanged from the single-block circuit"
    source: "run JSON: config.multiplicative_depth"
  - id: full.block_matrix_products
    value: 1872
    tag: "[V]"
    scope: "Packed dense products across the twelve blocks"
    source: "run JSON: config.block_matrix_products"
  - id: full.ct_ct_mults
    value: 18076
    tag: "[V]"
    scope: "Ciphertext-ciphertext multiplications across the complete model"
    source: "run JSON: config.operation_counts"
  - id: full.ct_pt_mults
    value: 2133839
    tag: "[V]"
    scope: "Ciphertext-plaintext multiplications across the complete model"
    source: "run JSON: config.operation_counts"

  # --- memory ---
  - id: full.gpu_peak_mib
    value: 9839
    unit: MiB
    tag: "[V]"
    scope: >
      Peak device-wide memory-used sample during the evaluating run, within the 40 GB device.
      The device was empty at allocation, so attribution to the run is reasonable; the sampler
      is not a per-process metric. The value is reached at about 400 s and remains flat for the
      final 94% of the run.
    source: "telemetry CSV: gpu0_mem_used_mib"
  - id: full.host_peak_mib
    value: 50930
    unit: MiB
    tag: "[V]"
    scope: "Peak host resident memory of the evaluating process (high-water mark)"
    source: "telemetry CSV: target_vmhwm_mib"

  # --- security posture asserted by the run ---
  - id: full.intermediate_decrypt_attempts
    value: 0
    tag: "[V]"
    scope: >
      The evaluating party attempted no decryption outside the declared client boundaries.
      Asserted by the driver, not inferred.
    source: "run JSON: intermediate_decrypt_attempts"
  - id: full.evaluator_has_private_key
    value: false
    tag: "[V]"
    scope: "The compute provider never holds the secret key"
    source: "run JSON: evaluator_has_private_key"

# ---------------------------------------------------------------------------
# 9. Derived communication accounting
#
# Ciphertext-object counts follow from the implemented boundary schedule. They are not network
# messages or byte counts: the evaluated roles share one process and no wire serialization exists.
# ---------------------------------------------------------------------------

communication:
  - id: comm.block_server_to_client_ciphertexts
    value: 130
    tag: "[A]"
    scope: >
      Ciphertext objects presented to the client by one transformer block: 26 LayerNorm
      inverse-square-root inputs, 91 attention score tiles, and 13 GELU inputs.
    source: "derived from the checked block boundary schedule"
  - id: comm.block_client_to_server_ciphertexts
    value: 766
    tag: "[A]"
    scope: >
      Ciphertext objects returned by the client in one transformer block: 26 LayerNorm inverses,
      727 attention-weight tiles, and 13 GELU outputs.
    source: "derived from the checked block boundary schedule"
  - id: comm.full_server_to_client_boundary_ciphertexts
    value: 1719
    tag: "[A]"
    scope: "All complete-model nonlinear and refresh boundaries; excludes the final output"
    source: "derived in reviews/2026-08-14-paper-evidence-revision.md"
  - id: comm.full_client_to_server_boundary_ciphertexts
    value: 9339
    tag: "[A]"
    scope: "All complete-model nonlinear and refresh boundaries; excludes the initial input"
    source: "derived in reviews/2026-08-14-paper-evidence-revision.md"
  - id: comm.full_boundary_ciphertexts_total
    value: 11058
    tag: "[A]"
    scope: "Sum of complete-model ciphertext objects in both directions at declared boundaries"
    source: >
      derived from comm.full_server_to_client_boundary_ciphertexts and
      comm.full_client_to_server_boundary_ciphertexts
  - id: comm.initial_input_ciphertexts
    value: 13
    tag: "[A]"
    scope: "Client-to-server encrypted embedded-input groups"
    source: "derived from layout.token_groups"
  - id: comm.final_output_ciphertexts
    value: 1
    tag: "[A]"
    scope: "Server-to-client encrypted classification margin"
    source: "complete-model driver output path"
  - id: comm.full_ciphertexts_including_endpoints
    value: 11072
    tag: "[A]"
    scope: "Boundary ciphertext objects plus 13 initial inputs and one final output"
    source: "derived from comm.full_boundary_ciphertexts_total and endpoint rows"
  - id: comm.minimum_sequential_boundary_phases
    value: 63
    tag: "[A]"
    scope: >
      Algorithmic lower bound under ideal same-stage batching: four nonlinear phases per block,
      eleven inter-block refreshes, one head-input refresh, and three head nonlinearities. The
      current implementation does not perform this network batching.
    source: "derived from the protocol dependency graph"
  - id: comm.minimum_transport_phases_including_endpoints
    value: 65
    tag: "[A]"
    scope: "The 63 boundary phases plus initial input upload and final result return"
    source: "derived from comm.minimum_sequential_boundary_phases"
  - id: comm.networked_implementation
    value: false
    tag: "[V]"
    scope: "Client and server roles share one process and node in the evaluated implementation"
    source: "complete-model implementation boundary"
  - id: comm.serialized_bytes_measured
    value: false
    tag: "[V]"
    scope: "No wire serialization occurs in the evaluated implementation"
    source: "complete-model implementation boundary"
  - id: comm.serialized_byte_volume
    value: "unknown"
    tag: "[U]"
    scope: >
      Boundary levels, component counts, wire representation, compression, framing, and
      serialization overhead are not recorded; an honest network-byte total cannot be derived.
    source: "no serialized or networked client/server artifact"

# ---------------------------------------------------------------------------
# 10. External figures quoted from related work
#
# These are OTHER PEOPLE'S measurements, quoted so the manuscript can position its own cost
# honestly. They are [V] in the sense that the cited paper reports them; this project did not
# reproduce them and must never present them as its own measurement or as a controlled
# comparison. Hardware, library, model and workload differ in ways the manuscript states.
# ---------------------------------------------------------------------------

related_work:
  - id: rw.thor_end_to_end
    value: 602
    unit: s
    tag: "[V]"
    scope: >
      THOR's reported end-to-end non-interactive encrypted inference for a 12-layer, 768-wide
      encoder at 128 tokens on a single NVIDIA A100. Reported by the cited authors; not
      reproduced here.
    source: "THOR paper, Section 7.3.1 and Table 6 (cite: thor)"
  - id: rw.thor_layers
    value: 12
    tag: "[V]"
    scope: "THOR's evaluated encoder depth, matching this study's block count"
    source: "THOR paper, Section 7.1 (cite: thor)"
  - id: rw.thor_width
    value: 768
    tag: "[V]"
    scope: "THOR's evaluated hidden width, matching this study's"
    source: "THOR paper, Section 7.1 (cite: thor)"
  - id: rw.thor_tokens
    value: 128
    unit: tokens
    tag: "[V]"
    scope: "THOR's evaluated sequence length; longer than this study's 103-token prompt"
    source: "THOR paper, Section 7.1 (cite: thor)"
  - id: rw.thor_depth
    value: 13
    tag: "[V]"
    scope: "THOR's multiplicative depth before bootstrapping, equal to this study's depth"
    source: "THOR paper, Section 7.1 (cite: thor)"
  - id: rw.moai_reduction_vs_thor
    value: 52.8
    unit: "%"
    tag: "[V]"
    scope: >
      MOAI's reported reduction in evaluation time relative to THOR. Reported by the cited
      authors; not reproduced here.
    source: "MOAI, IACR ePrint 2025/991 (cite: moai2025)"
  - id: rw.dashformer_parameters
    value: 138905
    tag: "[V]"
    scope: >
      Total parameter count of the iDASH24 DASHformer protein-family classification model, the
      closest prior homomorphically evaluated transformer over biological sequence data. Reported
      by the cited authors; not reproduced here. Contrast with the released 0.1-billion-parameter
      DNAGPT configuration evaluated in this study.
    source: >
      Harmanci et al., IEEE Data Descriptions 1:109-112, 2024, section "iDASH24 Protein
      Classification Model" (cite: idash24descriptor)
  - id: rw.dashformer_blocks
    value: 1
    tag: "[V]"
    scope: >
      DASHformer's transformer block count, with a four-head self-attention layer. Contrast with
      the 12 released blocks evaluated in this study.
    source: >
      Harmanci et al., IEEE Data Descriptions 1:109-112, 2024, section "iDASH24 Protein
      Classification Model" (cite: idash24descriptor)
  - id: rw.dashformer_input_length
    value: 50
    unit: "amino acids"
    tag: "[V]"
    scope: >
      DASHformer's fixed input fragment length, over a 25-letter amino-acid alphabet and 25
      classes. Contrast with this study's 103-token genomic prompt.
    source: >
      Harmanci et al., IEEE Data Descriptions 1:109-112, 2024, sections "iDASH24 1.2 m Protein
      Sequence Dataset" and "iDASH24 Protein Classification Model" (cite: idash24descriptor)
  - id: rw.encrypted_dashformer_batch
    value: 163
    unit: sequences
    tag: "[V]"
    scope: >
      Batch size classified in a single execution by the encrypted DASHformer protocol, the
      first-place iDASH 2024 Track 1 solution. Reported by the cited authors; not reproduced here.
    source: "Yang et al., IACR ePrint 2024/1851, abstract (cite: encrypteddashformer)"
  - id: rw.encrypted_dashformer_time
    value: 165
    unit: s
    tag: "[V]"
    scope: >
      Wall-clock time for the encrypted DASHformer protocol to classify its 163-sequence batch at
      128-bit security, non-interactively and without bootstrapping. Reported by the cited
      authors; not reproduced here.
    source: "Yang et al., IACR ePrint 2024/1851, abstract (cite: encrypteddashformer)"
