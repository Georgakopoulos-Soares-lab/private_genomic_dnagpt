# ---------------------------------------------------------------------------
# 5. Plaintext reference model (Phase A) — the oracle the encrypted run must reproduce
# ---------------------------------------------------------------------------

plaintext_baseline:
  - id: base.gsr_accuracy
    value: 0.9124
    tag: "[V]"
    scope: "Human polyadenylation-signal recognition, released classification head, n = 22,604"
    reference: 0.9151
    reference_name: "DNAGPT"
    reference_scope: >
      DNAGPT's own reported accuracy for the 0.1B "M" variant on human PAS(AATAAA)
      (its Table S2), measured on a held-out test split of roughly a quarter of the
      set (train:val:test = 6:1.5:2.5). This work evaluates the full 22,604-example
      balanced set, so the comparison is same-model but not same-split.
    source: "docs/tasks.md; reference corrected in reviews/2026-08-08-paper-sources.md"
  - id: base.gsr_f1
    value: 0.916
    tag: "[V]"
    scope: "Same run as base.gsr_accuracy"
    source: "docs/tasks.md"
  - id: base.gsr_n
    value: 22604
    tag: "[V]"
    scope: >
      Full balanced 22,604-example corpus evaluated locally, including examples used to train
      the released head; not an independent held-out test split
    source: "docs/tasks.md"
  - id: base.gue_prom_core_mcc
